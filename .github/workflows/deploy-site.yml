# Rebuilds and publishes the website on GitHub Pages.
# Runs on every push that touches the forecasts or the site (so the daily push from
# run_daily.py updates it automatically), and by hand from the Actions tab.
# Requires Settings > Pages > Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "predictions/**"
      - "results/**"
      - "web/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python web/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
