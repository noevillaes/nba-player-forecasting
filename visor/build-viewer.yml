# Builds the forecast viewer for Windows (.exe) and macOS (.app) on GitHub's servers.
# Runs when you push a tag that starts with "v" (v1.0, v1.1, ...) or by hand from the Actions tab.
# On a tag it also creates a Release with both files attached, ready to share.
name: Build viewer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name "NBA Forecasts"
          --icon visor/nba.ico
          --add-data "visor/nba.ico;."
          --add-data "visor/fonts;fonts"
          visor/visor.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/NBA Forecasts.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # python.org's universal2 Python ships its own Tk and lets the app run on
      # both Apple Silicon and Intel Macs.
      - name: Install Python from python.org
        run: |
          curl -sSLo py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"
      - run: python3.12 -m pip install pyinstaller pillow
      - name: Build app
        run: |
          python3.12 -m PyInstaller --noconfirm --windowed --name "NBA Forecasts" \
            --target-arch universal2 \
            --osx-bundle-identifier io.github.noevillaes.nbaforecasts \
            --icon visor/nba.ico \
            --add-data "visor/nba.ico:." \
            --add-data "visor/fonts:fonts" \
            visor/visor.py
          cd dist && ditto -c -k --keepParent "NBA Forecasts.app" "NBA-Forecasts-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/NBA-Forecasts-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/NBA Forecasts.exe
            macos/NBA-Forecasts-mac.zip
          body: |
            Desktop viewer for the daily NBA player forecasts. It downloads the latest
            forecasts from this repo every time it opens, so it needs an internet connection.

            **Windows:** download `NBA Forecasts.exe` and open it. If Windows shows
            "Windows protected your PC", click *More info* and then *Run anyway*.

            **Mac:** download `NBA-Forecasts-mac.zip`, unzip it and drag *NBA Forecasts* to
            Applications. The first time, macOS will say it can't verify the developer:
            open *System Settings > Privacy & Security*, scroll down and click *Open Anyway*.
